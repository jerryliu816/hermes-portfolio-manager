[project]
name = "portfolio-manager"
version = "0.1.0"
description = "Personal portfolio management with GenAI document extraction"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "typer>=0.15",
    "rich>=13.9",
    "anthropic>=0.40",
    "pypdf>=5.1",
    "httpx>=0.28",
    "python-multipart>=0.0.20",
    "pyyaml>=6.0",
    "fastmcp>=3.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml",
    "reportlab>=4.2",
]

[project.scripts]
portfolio = "portfolio_manager.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/portfolio_manager"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]

[tool.ruff.lint.per-file-ignores]
# Autogenerated by Alembic; long CHECK-constraint literals are expected.
"backend/portfolio_manager/migrations/versions/*.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "backend"
packages = ["portfolio_manager"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["reportlab.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Autogenerated migration scripts.
module = ["portfolio_manager.migrations.*"]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]
markers = [
    "live: hits the real Anthropic API; requires RUN_LIVE_CLAUDE_TESTS=1",
]
